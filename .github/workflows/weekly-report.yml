name: Weekly FPL report

# Runs a few times a week so a fresh recommendation lands before each deadline.
# Adjust the cron to taste; times are UTC. Also runnable on demand.
on:
  schedule:
    - cron: "0 9 * * 4"   # Thursday 09:00 UTC
    - cron: "0 9 * * 5"   # Friday 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Generate report
        run: python -m fpl_agent --horizon 3 --save
      - name: Commit report if changed
        run: |
          git config user.name  "fpl-agent-bot"
          git config user.email "actions@github.com"
          git add reports/
          if git diff --cached --quiet; then
            echo "No report changes."
          else
            git commit -m "chore: weekly FPL report [skip ci]"
            git push
          fi
