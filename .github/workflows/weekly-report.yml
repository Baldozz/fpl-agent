name: FPL agent

# Publishes the dashboard / live / league pages, watches for injuries, and sends
# the pre-deadline WhatsApp plan. Times are UTC. Also runnable on demand.
on:
  schedule:
    - cron: "0 * * * 4,5"      # Thu & Fri hourly — catch the ~2h-before-deadline alert
    - cron: "0 8 * * 1,2,3"    # Mon–Wed 08:00 — between-GW injury watch + pages
    - cron: "0 13,16,19 * * 6" # Sat — refresh live scores during matches
    - cron: "0 14,16,19 * * 0" # Sun — refresh live scores during matches
    - cron: "0 20 * * 1"       # Mon night — Monday-game live refresh
  workflow_dispatch:

permissions:
  contents: write

env:
  FPL_TEAM_ID: ${{ vars.FPL_TEAM_ID }}
  FPL_LEAGUE_ID: ${{ vars.FPL_LEAGUE_ID }}
  XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
  WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
  WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}

jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt

      - name: Recommendation report (markdown) for the upcoming GW
        run: python -m fpl_agent --horizon 3 --save --no-grok || echo "skipped"
      - name: Unified site (Dashboard + My Team + League) -> docs/index.html
        run: python -m fpl_agent --site --html --no-grok || echo "skipped"

      - name: Pre-deadline WhatsApp plan (fires only within the 2h window)
        run: python -m fpl_agent.notify --mode deadline || echo "skipped"
      - name: Between-GW injury watch (alerts on new flags)
        run: python -m fpl_agent.notify --mode monitor || echo "skipped"

      - name: Commit pages / reports / alert state if changed
        run: |
          git config user.name  "fpl-agent-bot"
          git config user.email "actions@github.com"
          git add reports/ docs/ state/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: FPL agent update [skip ci]"
            git push
          fi
